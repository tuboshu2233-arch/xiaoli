<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>饼图 · 扇区聚焦</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <main class="stage">
      <div class="figure" id="figure">
        <svg id="pie" viewBox="0 0 460 460" role="img" aria-label="饼图扇区聚焦动效，自动轮换高亮当前扇区"></svg>
        <div class="readout" id="readout"><strong>住宿</strong><span>34%</span></div>
      </div>
      <p class="hint">自动轮换高亮 · 悬停暂停 · 点击扇区聚焦</p>
    </main>
    <script src="src/demo.js"></script>
  </body>
</html>
