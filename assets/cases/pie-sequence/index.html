<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>饼图 · 分段入场</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <main class="stage">
      <div class="card">
        <svg id="pie" viewBox="0 0 420 420" role="img" aria-label="饼图分段入场动画，依次显示四类占比"></svg>

      </div>
    </main>
