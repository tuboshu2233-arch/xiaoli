<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>数据表格 · 侧栏快速查看</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <main class="stage">
      <section class="panel" id="panel">
        <div class="topline">
          <div class="tabs"><button type="button" class="active">我的应用</button><button type="button">未来活动</button></div>
          <div class="views" aria-hidden="true"><span class="v active"></span><span class="v"></span><span class="v"></span></div>
        </div>
        <div class="toolbar">
          <label class="search"><i></i><input type="search" placeholder="应用名称" aria-label="搜索应用" /></label>
          <button type="button" class="select">周期 · 最近 7 天<span>⌄</span></button>
          <button type="button" class="select">状态 · 全部<span>⌄</span></button>
          <button type="button" class="plus" aria-label="新建">+</button>
          <button type="button" class="link">管理列</button>
        </div>
        <div class="scroll">
          <table>
            <thead>
              <tr><th class="c-check">选</th><th class="c-status">状态</th><th class="c-app">应用</th><th>花费</th><th>展示</th><th>点击</th><th>转化</th><th>CPA</th></tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div class="fade" id="fade" hidden></div>
        <aside class="drawer" id="drawer" aria-hidden="true" aria-label="应用详情">
          <button class="close" id="close" type="button" aria-label="关闭详情">×</button>
          <div class="drawer-head"><span class="app-icon" id="drawer-icon">A</span><div><strong id="drawer-name">应用名称</strong><span id="drawer-status">进行中</span></div></div>
          <div class="stats" id="drawer-stats"></div>
          <div class="mini">
            <div class="mini-head"><span>近 7 天花费</span><b id="drawer-sum">$0.00</b></div>
            <div class="bars" id="drawer-bars"></div>
          </div>
          <div class="drawer-actions"><button type="button" class="primary">查看完整报表</button><button type="button" class="secondary" id="drawer-close">关闭</button></div>
        </aside>
      </section>
      <p class="hint">点击任意行，从右侧滑出详情侧栏 · Esc 或点击遮罩关闭</p>
    </main>
    <script src="src/demo.js"></script>
  </body>
</html>
