<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>加载 · UI Ball LDRS</title><link rel="stylesheet" href="app.bundle.css?v=2"><script src="app.bundle.js?v=2" defer></script></head><body><main class="loaders-page"><header class="loaders-heading"><div><span>UI BALL / LDRS</span><h1>加载动画<small id="total-count"></small></h1><p>旋转、跳跃、波形与粒子，选择合适的等待节奏。</p></div><button type="button" id="pause" aria-pressed="false">暂停动画</button></header><div class="loaders-controls"><label class="search-label"><span>搜索</span><input id="search" type="search" placeholder="中文 / English" autocomplete="off"></label><label class="color-label">颜色<input id="color" type="color" value="#202024" aria-label="动画颜色"></label><label>大小<input id="size" type="range" min="24" max="64" value="42" aria-label="动画大小"><output id="size-value">42</output></label><label>速度<select id="speed" aria-label="动画速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label></div><div class="loaders-count" id="match-count" role="status"></div><section class="loaders-grid" id="loaders-grid" aria-label="加载动画合集"></section><footer><span>官方原始组件 · 本地运行</span><span>UI Ball · Griffin Johnston · MIT</span></footer></main></body></html>
